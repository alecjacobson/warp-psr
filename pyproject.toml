[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-psr"
version = "0.1.0"
description = "Compatibility-first Poisson surface reconstruction experiments in NVIDIA Warp"
requires-python = ">=3.10"
dependencies = ["warp-lang==1.19.0"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26", "scipy>=1.11"]
visualization = ["matplotlib>=3.8", "scikit-image>=0.23", "plyfile>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["reference: requires compiled pinned C++ reference", "cuda: requires an NVIDIA GPU"]
